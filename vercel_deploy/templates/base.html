<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Manager Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            overflow-x: hidden;
            color: #334155;
            min-height: 100vh;
        }
        
        #wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ================= 1. Sidebar (ด้านซ้าย) ================= */
        #sidebar-wrapper {
            min-width: 260px;
            max-width: 260px;
            background: linear-gradient(180deg, #0f172a 0%, #1a1f2e 100%);
            color: #f8fafc;
            transition: margin 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 8px 0 24px rgba(0,0,0,0.15);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        #sidebar-wrapper.collapsed {
            margin-left: -260px;
        }

        .sidebar-heading {
            padding: 1.75rem 1.25rem;
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .sidebar-heading i {
            color: #38bdf8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .sidebar-nav {
            list-style: none;
            padding: 1.25rem 0;
            margin: 0;
            flex-grow: 1;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.9rem 1.5rem;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0.4rem 0.75rem;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .sidebar-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: #38bdf8;
            transform: scaleY(0);
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        .sidebar-link i {
            font-size: 1.3rem;
            margin-right: 14px;
            transition: all 0.3s ease;
        }

        .sidebar-link:hover::before, 
        .sidebar-link.active::before {
            transform: scaleY(1);
        }

        .sidebar-link:hover, 
        .sidebar-link.active {
            background-color: rgba(56, 189, 248, 0.1);
            color: #fff;
            padding-left: 1.75rem;
        }

        .sidebar-link:hover i, 
        .sidebar-link.active i {
            color: #38bdf8;
            transform: translateX(4px);
        }

        /* ================= 2. Content (ด้านขวา) ================= */
        #page-content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        }

        .top-navbar {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 999;
            border-bottom: 1px solid #e2e8f0;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: #475569;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.5rem;
            border-radius: 8px;
        }

        .toggle-btn:hover {
            color: #0f172a;
            background-color: rgba(56, 189, 248, 0.08);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .main-container {
            padding: 2.5rem;
            flex: 1;
        }

        /* ปรับแต่ง Card ในทุกหน้าให้สวยขึ้นอัตโนมัติ */
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:hover {
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            transform: translateY(-4px);
        }

        .card-header {
            border-top-left-radius: 16px !important;
            border-top-right-radius: 16px !important;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 1.25rem 1.5rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        .btn {
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .table {
            border-collapse: collapse;
        }

        .table th {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid #e2e8f0;
            font-weight: 700;
            color: #475569;
            padding: 1rem;
        }

        .table td {
            border: 1px solid #e2e8f0;
            padding: 0.875rem 1rem;
            vertical-align: middle;
        }

        .table-hover tbody tr:hover {
            background-color: rgba(56, 189, 248, 0.05);
        }

        .badge {
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        
        <div id="sidebar-wrapper">
            <div class="sidebar-heading">
                <i class="bi bi-box-seam-fill me-2"></i>STOCK CRAD
            </div>
            
            <ul class="sidebar-nav">
                <li>
                    <a href="/" class="sidebar-link">
                        <i class="bi bi-grid-1x2-fill"></i> ภาพรวม (Dashboard)
                    </a>
                </li>
                <li>
                    <a href="/stock" class="sidebar-link">
                        <i class="bi bi-box-arrow-in-down"></i> รับเข้าสินค้า
                    </a>
                </li>
                <li>
                    <a href="/inventory" class="sidebar-link">
                        <i class="bi bi-boxes"></i> สต็อกคงเหลือ
                    </a>
                </li>
                <li>
                    <a href="/orders" class="sidebar-link">
                        <i class="bi bi-cart-check-fill"></i> ขายสินค้า
                    </a>
                </li>
                <li>
                    <a href="/profit-summary" class="sidebar-link">
                        <i class="bi bi-graph-up-arrow"></i> สรุปกำไรรายเดือน
                    </a>
                </li>
                <li>
                    <a href="/settings" class="sidebar-link">
                        <i class="bi bi-gear"></i> ตั้งค่าระบบ
                    </a>
                </li>
            </ul>

            <div class="mt-auto p-3 text-center" style="font-size: 0.75rem; color: #64748b;">
                System v1.0 <br> &copy; 2026
            </div>
        </div>

        <div id="page-content-wrapper">
            
            <div class="top-navbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="toggle-btn" id="menu-toggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <h5 class="mb-0 fw-semibold text-secondary d-none d-sm-block">Mercari Management System</h5>
                </div>
                
                <div class="user-profile">
                    <span class="badge bg-primary rounded-pill px-3 py-2">
                        <i class="bi bi-person-circle me-1"></i> Admin
                    </span>
                </div>
            </div>

            <div class="main-container">
                {% block content %}{% endblock %}
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // ระบบปุ่มยุบ/ขยายเมนู (Sidebar)
        document.getElementById("menu-toggle").addEventListener("click", function(e) {
            e.preventDefault();
            document.getElementById("sidebar-wrapper").classList.toggle("collapsed");
        });

        // ระบบไฮไลท์เมนูหน้าปัจจุบัน
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.sidebar-link');
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
            }
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
