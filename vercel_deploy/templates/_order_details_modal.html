<style>
    .item-row { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid #eee; }
    .item-img { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; margin-right: 12px; border: 1px solid #ddd; }
    .view-item-row {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px;
        background-color: #f8fafc;
    }
    .view-item-row .item-img { width: 48px; height: 48px; margin-right: 0; }
    .view-item-row .product-detail-image,
    .view-item-row .product-detail-placeholder {
        width: 64px;
        height: 64px;
        flex: 0 0 64px;
        border-radius: 8px;
    }
    .view-item-row .product-detail-image { object-fit: cover; }
    .view-item-row .product-detail-placeholder { color: #64748b; }
    @media (max-width: 767.98px) {
        #viewOrderModal .modal-dialog { margin: 0.5rem; }
        #viewOrderModal .modal-content { max-height: calc(100dvh - 1rem); }
        #viewOrderModal .modal-body { min-height: 0; overflow-y: auto; padding: 1rem !important; }
        #viewOrderModal .modal-footer { gap: 0.5rem; }
        #viewOrderModal .modal-footer > button { flex: 1 1 auto; margin: 0 !important; }
    }
</style>

<div class="modal fade" id="viewOrderModal" tabindex="-1" data-readonly="{{ 'true' if order_details_readonly|default(false) else 'false' }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow-lg" style="border-radius: 15px;">
            <div class="modal-header" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border-top-left-radius: 15px; border-top-right-radius: 15px;">
                <h5 class="modal-title fw-bold"><i class="bi bi-receipt"></i> รายละเอียด Order <span id="viewOrderId"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-primary fw-bold">👤 ชื่อลูกค้า</label>
                        <input type="text" id="viewCustomerName" class="form-control bg-light" readonly style="border-radius: 10px;">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-primary fw-bold">📅 วันที่ขาย</label>
                        <input type="text" id="viewOrderDate" class="form-control bg-light" readonly style="border-radius: 10px;">
                    </div>
                </div>
                <hr>
                <label class="form-label fw-600 mb-2">รายการสินค้าในออเดอร์</label>
                <div id="viewOrderItemsList" class="d-grid gap-2 mb-3"></div>

                <div class="bg-light p-3 rounded" style="border: 1px dashed #cbd5e1;">
                    <h6 class="fw-bold mb-3">สรุปยอด</h6>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">ยอดขายรวม:</span>
                        <strong class="text-success" id="viewTotalRevenue"></strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">ต้นทุนรวม:</span>
                        <strong class="text-danger" id="viewTotalCost"></strong>
                    </div>
                    <div class="d-flex justify-content-between pt-2 border-top">
                        <span class="fw-bold">กำไรสุทธิ:</span>
                        <h4 class="fw-bold mb-0" id="viewProfit"></h4>
                    </div>
                </div>

                <div id="viewSlipBox" class="mt-3" style="display:none;">
                    <label class="form-label fw-600"><i class="bi bi-receipt"></i> สลิปโอนเงิน</label>
                    <div class="bg-light p-3 rounded" style="border: 1px dashed #cbd5e1;">
                        <a id="viewSlipLink" href="#" target="_blank" rel="noopener noreferrer" class="d-inline-block">
                            <img id="viewSlipImg" src="" alt="สลิปโอนเงิน" style="max-width: 100%; max-height: 220px; border-radius: 10px; border: 1px solid #e2e8f0; object-fit: contain; background: #fff;">
                        </a>
                        <div id="viewSlipPdf" class="mt-1" style="display:none;">
                            <a id="viewSlipPdfLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-file-earmark-pdf"></i> เปิดไฟล์สลิป (PDF)
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light" style="border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;">
                {% if not (order_details_readonly|default(false)) %}
                <button type="button" class="btn btn-danger me-auto" id="deleteOrderBtn" onclick="deleteCurrentOrder()">
                    <i class="bi bi-trash"></i> ลบออเดอร์
                </button>
                {% endif %}
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">ปิด</button>
                {% if not (order_details_readonly|default(false)) %}
                <button type="button" class="btn btn-success px-4" id="saveUpdateBtn" onclick="saveOrderUpdates()">
                    <i class="bi bi-save"></i> บันทึกการแก้ไข
                </button>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script>
    let currentEditingOrderId = null;

    function mediaUrl(path) {
        if (!path) return '';
        if (path.startsWith('data:') || path.startsWith('http://') || path.startsWith('https://')) return path;
        return '/' + String(path).replace(/^\//, '');
    }

    function showDetails(id, name, date, revenue, cost, profit, dataId) {
        currentEditingOrderId = id;
        document.getElementById('viewOrderId').innerText = '#' + id;
        document.getElementById('viewCustomerName').value = name || '';
        document.getElementById('viewOrderDate').value = date || '';
        document.getElementById('viewTotalRevenue').innerText = '฿' + parseFloat(revenue).toLocaleString(undefined, { minimumFractionDigits: 2 });
        document.getElementById('viewTotalCost').innerText = '฿' + parseFloat(cost).toLocaleString(undefined, { minimumFractionDigits: 2 });

        const profitValue = parseFloat(profit);
        const profitElement = document.getElementById('viewProfit');
        profitElement.innerText = (profitValue >= 0 ? '+฿' : '฿') + profitValue.toLocaleString(undefined, { minimumFractionDigits: 2 });
        profitElement.className = 'fw-bold mb-0 ' + (profitValue >= 0 ? 'text-success' : 'text-danger');

        const slipElement = document.getElementById('slip-' + dataId);
        let slipPath = '';
        try {
            slipPath = slipElement ? JSON.parse(slipElement.textContent) : '';
        } catch (error) {
            console.error('Could not read order slip data:', error);
        }
        const slipBox = document.getElementById('viewSlipBox');
        const slipLink = document.getElementById('viewSlipLink');
        const slipImage = document.getElementById('viewSlipImg');
        const slipPdf = document.getElementById('viewSlipPdf');
        const slipPdfLink = document.getElementById('viewSlipPdfLink');

        if (slipPath) {
            const url = mediaUrl(slipPath);
            const isPdf = /\.pdf$/i.test(slipPath) || String(slipPath).startsWith('data:application/pdf');
            slipBox.style.display = 'block';
            if (isPdf) {
                slipLink.style.display = 'none';
                slipImage.src = '';
                slipPdf.style.display = 'block';
                slipPdfLink.href = url;
            } else {
                slipPdf.style.display = 'none';
                slipLink.style.display = 'inline-block';
                slipLink.href = url;
                slipImage.src = url;
            }
        } else {
            slipBox.style.display = 'none';
            slipImage.src = '';
        }

        const itemsElement = document.getElementById('data-' + dataId);
        let items = [];
        try {
            items = itemsElement ? JSON.parse(itemsElement.textContent) : [];
        } catch (error) {
            console.error('Could not read order item data:', error);
        }
        const listBody = document.getElementById('viewOrderItemsList');
        listBody.replaceChildren();
        const readOnly = document.getElementById('viewOrderModal').dataset.readonly === 'true';

        items.forEach(item => {
            const row = document.createElement('div');
            row.className = 'view-item-row item-row row g-2 align-items-center';
            const productColumn = document.createElement('div');
            productColumn.className = 'col-md-6';
            const productLabel = document.createElement('label');
            productLabel.className = 'form-label fw-600';
            productLabel.textContent = 'สินค้า';
            const productDetails = document.createElement('div');
            productDetails.className = 'd-flex align-items-center gap-2';

            let image;
            if (item.img) {
                image = document.createElement('img');
                image.src = mediaUrl(item.img);
                image.alt = item.name || 'รูปสินค้า';
                image.className = 'item-img product-detail-image';
                image.addEventListener('error', function() {
                    this.replaceWith(createProductImagePlaceholder());
                }, { once: true });
            } else {
                image = createProductImagePlaceholder();
            }

            const productName = document.createElement('div');
            productName.className = 'fw-bold text-dark text-break';
            productName.textContent = item.name || 'สินค้า';
            productDetails.append(image, productName);
            productColumn.append(productLabel, productDetails);

            const priceColumn = document.createElement('div');
            priceColumn.className = 'col-md-3';
            const priceLabel = document.createElement('label');
            priceLabel.className = 'form-label fw-600';
            priceLabel.textContent = 'ราคาขาย/ชิ้น';
            const priceInput = document.createElement('input');
            priceInput.type = 'number';
            priceInput.className = 'form-control bg-light edit-price';
            priceInput.dataset.itemId = item.id;
            priceInput.value = item.price;
            priceInput.step = '0.01';
            priceInput.readOnly = readOnly;
            priceInput.style.borderRadius = '10px';
            priceColumn.append(priceLabel, priceInput);

            const quantityColumn = document.createElement('div');
            quantityColumn.className = 'col-md-3';
            const quantityLabel = document.createElement('label');
            quantityLabel.className = 'form-label fw-600';
            quantityLabel.textContent = 'จำนวน';
            const quantityInput = document.createElement('input');
            quantityInput.type = 'number';
            quantityInput.className = 'form-control bg-light edit-qty';
            quantityInput.dataset.itemId = item.id;
            quantityInput.value = item.qty;
            quantityInput.min = '1';
            quantityInput.readOnly = readOnly;
            quantityInput.style.borderRadius = '10px';
            quantityColumn.append(quantityLabel, quantityInput);

            row.append(productColumn, priceColumn, quantityColumn);
            listBody.appendChild(row);
        });

        bootstrap.Modal.getOrCreateInstance(document.getElementById('viewOrderModal')).show();
    }

    function showDetailsFromTrigger(trigger) {
        const order = trigger.dataset;
        if (!order.orderId) return;
        showDetails(order.orderId, order.customer, order.orderDate, order.revenue, order.cost, order.profit, order.orderId);
    }

    document.addEventListener('click', function(event) {
        const row = event.target.closest('.order-row');
        if (row) showDetailsFromTrigger(row);
    });

    async function saveOrderUpdates() {
        if (!currentEditingOrderId) return;
        const rows = document.querySelectorAll('#viewOrderItemsList .item-row');
        const updatedItems = Array.from(rows, row => {
            const priceInput = row.querySelector('.edit-price');
            const qtyInput = row.querySelector('.edit-qty');
            return {
                item_id: parseInt(priceInput.dataset.itemId),
                sell_price: parseFloat(priceInput.value),
                sell_qty: parseInt(qtyInput.value)
            };
        });
        if (!confirm('คุณต้องการบันทึกการแก้ไขออเดอร์นี้ใช่หรือไม่?')) return;

        const button = document.getElementById('saveUpdateBtn');
        const originalText = button.innerHTML;
        button.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';
        button.disabled = true;
        try {
            const response = await fetch(`/order/update/${currentEditingOrderId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: updatedItems })
            });
            if (response.ok) window.location.reload();
            else {
                alert('เกิดข้อผิดพลาดในการอัปเดตออเดอร์');
                button.innerHTML = originalText;
                button.disabled = false;
            }
        } catch (error) {
            console.error('Error:', error);
            alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์');
            button.innerHTML = originalText;
            button.disabled = false;
        }
    }

    async function deleteCurrentOrder() {
        if (!currentEditingOrderId) return;
        if (!confirm('คุณต้องการลบออเดอร์นี้ใช่หรือไม่? ระบบจะคืนสต็อกสินค้าอัตโนมัติ')) return;
        const button = document.getElementById('deleteOrderBtn');
        const originalText = button.innerHTML;
        button.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังลบ...';
        button.disabled = true;
        try {
            const response = await fetch(`/order/delete/${currentEditingOrderId}`, { method: 'POST' });
            if (response.ok) window.location.reload();
            else {
                alert('เกิดข้อผิดพลาดในการลบออเดอร์');
                button.innerHTML = originalText;
                button.disabled = false;
            }
        } catch (error) {
            console.error('Error:', error);
            alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์');
            button.innerHTML = originalText;
            button.disabled = false;
        }
    }

    function createProductImagePlaceholder() {
        const placeholder = document.createElement('div');
        placeholder.className = 'item-img product-detail-placeholder bg-light d-flex align-items-center justify-content-center';
        placeholder.innerHTML = '<i class="bi bi-image" aria-hidden="true"></i>';
        return placeholder;
    }
</script>
